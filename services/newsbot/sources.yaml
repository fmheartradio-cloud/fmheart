# RSS or list-page sources for Sinhala news (Phase 1).
# Disable a source with active: false
sources:
  - id: nethnews
    name: Neth News
    rss: https://www.nethnews.lk/feed/
    category: දේශීය
    active: true
  - id: newsfirst-sinhala
    name: News First Sinhala
    list_url: https://sinhala.newsfirst.lk/
    category: දේශීය
    active: true
  - id: adaderana-sinhala
    name: Ada Derana Sinhala
    rss: https://sinhala.adaderana.lk/rsshotnews.php
    category: දේශීය
    active: true
  - id: bbc-sinhala
    name: BBC Sinhala
    rss: https://feeds.bbci.co.uk/sinhala/rss.xml
    category: ජාත්‍යන්තර
    active: true
  - id: lankaenews
    name: Lanka eNews
    list_url: https://www.lankaenews.com/
    category: දේශීය
    active: true
  - id: lankahotnews
    name: Lanka Hot News
    rss: https://www.lankahotnews.net/rss.xml
    category: දේශීය
    active: true

# Bot auto-publishes ingested articles (manual admin posts stay draft until published)
default_status: published
max_per_source: 8
