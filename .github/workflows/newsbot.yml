# Runs on GitHub's servers (PC not required). Cron is UTC.
name: Newsbot cron

on:
  schedule:
    # Every 10 minutes, offset from :00 to reduce GitHub dropping jobs under load
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: newsbot-cron
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger news ingest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret is missing"
            exit 1
          fi
          code=$(curl -sS -o /tmp/newsbot-response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            "https://fmheart-tau.vercel.app/api/cron/newsbot")
          echo "HTTP $code"
          cat /tmp/newsbot-response.json
          echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi
